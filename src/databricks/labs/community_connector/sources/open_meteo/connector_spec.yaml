# Open-Meteo Community Connector Spec
# This file defines the specification for the connector including
# connection parameters and allowlist options.

connection:
  parameters:
    - name: latitude
      type: string
      required: true
      description: >
        Geographic latitude in decimal degrees (WGS84) for the forecast
        location. Example: "52.52" for Berlin.

    - name: longitude
      type: string
      required: true
      description: >
        Geographic longitude in decimal degrees (WGS84) for the forecast
        location. Example: "13.41" for Berlin.

    - name: apikey
      type: string
      required: false
      description: >
        API key for commercial Open-Meteo subscriptions. Omit for
        free tier (non-commercial use, CC-BY 4.0 license).
        When provided, requests are sent to customer-api.open-meteo.com
        instead of api.open-meteo.com.

external_options_allowlist: "forecast_days,timezone,temperature_unit,wind_speed_unit,precipitation_unit,models,hourly_variables,daily_variables"
